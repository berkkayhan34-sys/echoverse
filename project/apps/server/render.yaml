services:
  - type: web
    name: echoverse-server
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: npm --workspace=@echoverse/server start
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ECHO_VERSE_MAIN_OWNER_EMAIL
        sync: false
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://berkkayhan34-sys.github.io"
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_COOKIE_SECURE
        value: "true"
      - key: WEB_COOKIE_SAMESITE
        value: "none"
