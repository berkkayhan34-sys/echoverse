name: Deploy EchoVerse MacBook server

on:
  push:
    branches: ["main"]
    paths:
      - "project/apps/server/**"
      - "project/packages/**"
      - "package.json"
      - "package-lock.json"
      - "VERSION"
      - "deploy/systemd/echoverse.service"
      - ".github/workflows/deploy-self-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echoverse-macbook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, restart, and health-check MacBook server
    runs-on: [self-hosted, Linux, X64, echoverse-server]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "22"
          test -n "$(command -v npm)"
          test -n "$(command -v make)"
          test -n "$(command -v g++)"
          test -n "$(command -v python3)"
          test -n "$(command -v systemctl)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          test -d "$XDG_RUNTIME_DIR"

      - name: Install workspace dependencies
        run: npm ci

      - name: Run server verification
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.config/echoverse/server.env"
          grep -q '^DATABASE_URL=' "$HOME/.config/echoverse/server.env"
          grep -q '^JWT_SECRET=' "$HOME/.config/echoverse/server.env"
          grep -q '^ECHO_VERSE_MAIN_OWNER_EMAIL=' "$HOME/.config/echoverse/server.env"
          grep -q '^CORS_ORIGINS=' "$HOME/.config/echoverse/server.env"

      - name: Install user service unit
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0644 deploy/systemd/echoverse.service \
            "$HOME/.config/systemd/user/echoverse.service"

      - name: Restart service
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          test -d "$XDG_RUNTIME_DIR"
          systemctl --user daemon-reload
          systemctl --user enable echoverse.service
          systemctl --user restart echoverse.service

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/health > /tmp/echoverse-health.json; then
              cat /tmp/echoverse-health.json
              exit 0
            fi
            sleep 1
          done
          systemctl --user --no-pager --full status echoverse.service || true
          journalctl --user -u echoverse.service --no-pager -n 80 || true
          exit 1
