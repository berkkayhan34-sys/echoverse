name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: make tooling-check
      - run: make version-check
      - run: make ai-check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run dependency:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-evidence
          path: |
            tmp/coverage/
            tmp/test-results/
          if-no-files-found: error

  database:
    name: PostgreSQL migration and relationship tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: echoverse_test
          # A run-scoped value avoids trust authentication without storing a credential.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echoverse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}@127.0.0.1:5432/echoverse_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-evidence
          path: tmp/test-results/database.json
          if-no-files-found: error
