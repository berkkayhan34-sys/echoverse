name: Build EchoVerse Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "project/apps/desktop/**"
      - "VERSION"
      - "package.json"
      - "project/apps/server/package.json"
      - "project/apps/web/package.json"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project/apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Validate canonical version
        shell: pwsh
        working-directory: .
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $desktopVersion = (Get-Content "project/apps/desktop/package.json" -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "VERSION is empty" }
          if ($desktopVersion -ne $version) { throw "desktop/package.json version mismatch: canonical=$version package=$desktopVersion" }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .
      - run: npm run dist:win
      - name: Verify Windows updater artifacts
        run: npm run verify:artifacts -- --target win --arch x64
      - uses: actions/upload-artifact@v7
        with:
          name: EchoVerse-Windows
          path: tmp/release/desktop/*.exe
          if-no-files-found: error

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: project/apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Validate canonical version
        shell: bash
        working-directory: .
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DESKTOP_VERSION=$(node -p "require('./project/apps/desktop/package.json').version")
          test -n "$VERSION"
          test "$DESKTOP_VERSION" = "$VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:x64
      - name: Verify macOS Intel artifacts
        run: npm run verify:artifacts -- --target mac --arch x64
      - name: Launch packaged macOS Intel smoke test
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/echoverse-intel-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "tmp/release/desktop/EchoVerse-$(tr -d '[:space:]' < VERSION)-x64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          ECHO_VERSE_SMOKE_TEST=1 "$mount_point/EchoVerse.app/Contents/MacOS/EchoVerse"
      - uses: actions/upload-artifact@v7
        with:
          name: EchoVerse-macOS-Intel
          path: |
            tmp/release/desktop/*.dmg
            tmp/release/desktop/*.zip
          if-no-files-found: error

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    defaults:
      run:
        working-directory: project/apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Validate canonical version
        shell: bash
        working-directory: .
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DESKTOP_VERSION=$(node -p "require('./project/apps/desktop/package.json').version")
          test -n "$VERSION"
          test "$DESKTOP_VERSION" = "$VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:arm64
      - name: Verify macOS Apple Silicon artifacts
        run: npm run verify:artifacts -- --target mac --arch arm64
      - name: Launch packaged macOS Apple Silicon smoke test
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/echoverse-arm64-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "tmp/release/desktop/EchoVerse-$(tr -d '[:space:]' < VERSION)-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          ECHO_VERSE_SMOKE_TEST=1 "$mount_point/EchoVerse.app/Contents/MacOS/EchoVerse"
      - uses: actions/upload-artifact@v7
        with:
          name: EchoVerse-macOS-Apple-Silicon
          path: |
            tmp/release/desktop/*.dmg
            tmp/release/desktop/*.zip
          if-no-files-found: error
