name: Build EchoVerse Desktop

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm install

      - name: Build Windows
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-Windows
          path: desktop/release/*.exe
          if-no-files-found: error

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm install

      - name: Build Intel DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:x64

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-macOS-Intel
          path: desktop/release/*.dmg
          if-no-files-found: error

  mac-apple-silicon:
    name: macOS Apple Silicon
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm install

      - name: Build Apple Silicon DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:arm64

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-macOS-Apple-Silicon
          path: desktop/release/*.dmg
          if-no-files-found: error
