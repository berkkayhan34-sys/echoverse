name: Build EchoVerse Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/desktop/**"
      - "VERSION"
      - "package.json"
      - "apps/server/package.json"
      - "apps/web/package.json"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical version
        shell: pwsh
        working-directory: .
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $desktopVersion = (Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "VERSION is empty" }
          if ($desktopVersion -ne $version) { throw "desktop/package.json version mismatch: canonical=$version package=$desktopVersion" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-Windows
          path: apps/desktop/release/*.exe

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical version
        shell: bash
        working-directory: .
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test -n "$VERSION"
          test "$DESKTOP_VERSION" = "$VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:x64
      - uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-macOS-Intel
          path: apps/desktop/release/*.{dmg,zip}

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical version
        shell: bash
        working-directory: .
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test -n "$VERSION"
          test "$DESKTOP_VERSION" = "$VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: .
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-macOS-Apple-Silicon
          path: apps/desktop/release/*.{dmg,zip}
