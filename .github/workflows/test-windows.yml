name: Test Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Test Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win
      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/release/EchoVerse-Setup-1.6.5.exe")) { throw "Installer missing" }
          if (!(Test-Path "desktop/release/EchoVerse-Setup-1.6.5.exe.blockmap")) { throw "Blockmap missing" }
          if (!(Test-Path "desktop/release/latest.yml")) { throw "latest.yml missing" }

          $content = Get-Content "desktop/release/latest.yml" -Raw
          if ($content -notmatch "version:\s*1\.6\.5") { throw "Version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-1\.6\.5\.exe") { throw "Installer filename mismatch" }
      - uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-v1.6.5-Windows-Test
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
