name: Test Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Test Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $desktopVersion = (Get-Content "desktop/package.json" -Raw | ConvertFrom-Json).version
          if ($desktopVersion -ne $version) { throw "desktop/package.json version mismatch: canonical=$version package=$desktopVersion" }
          if (-not $version) { throw "desktop/package.json version missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Testing EchoVerse $version"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win


      - name: Verify branding and sound assets
        shell: pwsh
        run: |
          $required = @(
            "desktop/assets/echoverse.ico",
            "desktop/assets/echoverse-icon.png",
            "desktop/assets/echoverse-splash.png",
            "desktop/public/echoverse-icon.png",
            "desktop/public/echoverse-wordmark.png",
            "desktop/public/sounds/voice-join.wav",
            "desktop/public/sounds/voice-leave.wav",
            "desktop/public/sounds/message.wav",
            "desktop/public/sounds/mic-toggle.wav",
            "desktop/public/sounds/incoming-call.wav",
            "desktop/dist/echoverse-icon.png",
            "desktop/dist/echoverse-wordmark.png",
            "desktop/dist/sounds/voice-join.wav",
            "desktop/dist/sounds/voice-leave.wav",
            "desktop/dist/sounds/message.wav",
            "desktop/dist/sounds/mic-toggle.wav",
            "desktop/dist/sounds/incoming-call.wav"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required branding/sound asset missing: $file" }
          }

          $pkg = Get-Content "desktop/package.json" -Raw
          if ($pkg -notmatch '"to":\s*"branding"') { throw "Packaged branding resources are not configured" }

          $app = Get-Content "desktop/src/App.tsx" -Raw
          if ($app -match 'src="/echoverse-wordmark.png"') { throw "Absolute wordmark URL would break under file:// packaging" }
          if ($app -match '"/sounds/') { throw "Absolute sound URL would break under file:// packaging" }

          $main = Get-Content "desktop/electron/main.cjs" -Raw
          if ($main -notmatch 'process\.resourcesPath') { throw "Packaged Electron branding path missing" }

      - name: Verify v1.7.4 voice assets
        shell: pwsh
        run: |
          $files = @(
            "desktop/public/sounds/outgoing-call.wav",
            "desktop/public/sounds/call-connected.wav",
            "desktop/public/sounds/call-ended.wav",
            "desktop/public/sounds/deafen-toggle.wav",
            "desktop/public/sounds/screen-share-toggle.wav",
            "desktop/public/sounds/mention.wav"
          )
          foreach ($f in $files) {
            if (!(Test-Path $f)) { throw "Missing v1.7.4 sound asset: $f" }
          }

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "desktop/release/EchoVerse-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = "desktop/release/latest.yml"

          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          if (!(Test-Path $blockmap)) { throw "Blockmap missing: $blockmap" }
          if (!(Test-Path $latest)) { throw "latest.yml missing" }

          $content = Get-Content $latest -Raw
          Write-Host $content

          $escaped = [regex]::Escape($version)
          if ($content -notmatch "version:\s*$escaped") { throw "Version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-$escaped\.exe") { throw "Installer filename mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-Windows-Test
          path: |
            desktop/release/EchoVerse-Setup-*.exe
            desktop/release/EchoVerse-Setup-*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
