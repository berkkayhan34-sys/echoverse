name: Test Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Test Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify v1.6.4 updater metadata
        shell: powershell
        run: |
          if (!(Test-Path "desktop/release/latest.yml")) {
            throw "latest.yml missing"
          }

          $latest = Get-Content "desktop/release/latest.yml" -Raw
          Write-Host $latest

          if ($latest -notmatch "1\.6\.4") {
            throw "latest.yml version is not 1.6.4"
          }

          if (!(Get-ChildItem "desktop/release" -Filter "*.exe.blockmap")) {
            throw "Windows blockmap missing"
          }

      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-v1.6.4-Windows-Test
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
