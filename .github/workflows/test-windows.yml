name: Test Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Test Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $installer = "desktop/release/EchoVerse-Setup-1.6.7.exe"
          $blockmap = "desktop/release/EchoVerse-Setup-1.6.7.exe.blockmap"
          $latest = "desktop/release/latest.yml"

          if (!(Test-Path $installer)) { throw "Installer missing" }
          if (!(Test-Path $blockmap)) { throw "Blockmap missing" }
          if (!(Test-Path $latest)) { throw "latest.yml missing" }

          $content = Get-Content $latest -Raw
          Write-Host $content

          if ($content -notmatch "version:\s*1\.6\.6") { throw "Version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-1\.6\.6\.exe") { throw "Installer filename mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: EchoVerse-v1.6.7-Windows-Test
          path: |
            desktop/release/EchoVerse-Setup-1.6.7.exe
            desktop/release/EchoVerse-Setup-1.6.7.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
