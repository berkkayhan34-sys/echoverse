name: Test Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Test Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $desktopVersion = (Get-Content "project/apps/desktop/package.json" -Raw | ConvertFrom-Json).version
          if ($desktopVersion -ne $version) { throw "project/apps/desktop/package.json version mismatch: canonical=$version package=$desktopVersion" }
          if (-not $version) { throw "project/apps/desktop/package.json version missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Testing EchoVerse $version"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build Windows
        working-directory: project/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify branding and sound assets
        shell: pwsh
        run: |
          $required = @(
            "project/apps/desktop/assets/echoverse.ico",
            "project/apps/desktop/assets/echoverse-icon.png",
            "project/apps/desktop/assets/echoverse-splash.png",
            "project/apps/desktop/public/echoverse-icon.png",
            "project/apps/desktop/public/echoverse-wordmark.png",
            "project/apps/desktop/public/sounds/voice-join.wav",
            "project/apps/desktop/public/sounds/voice-leave.wav",
            "project/apps/desktop/public/sounds/message.wav",
            "project/apps/desktop/public/sounds/mic-toggle.wav",
            "project/apps/desktop/public/sounds/incoming-call.wav",
            "tmp/generated/desktop/echoverse-icon.png",
            "tmp/generated/desktop/echoverse-wordmark.png",
            "tmp/generated/desktop/sounds/voice-join.wav",
            "tmp/generated/desktop/sounds/voice-leave.wav",
            "tmp/generated/desktop/sounds/message.wav",
            "tmp/generated/desktop/sounds/mic-toggle.wav",
            "tmp/generated/desktop/sounds/incoming-call.wav"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required branding/sound asset missing: $file" }
          }

          $builderConfig = Get-Content "project/apps/desktop/electron-builder.config.cjs" -Raw
          if ($builderConfig -notmatch 'to:\s*"branding"') { throw "Packaged branding resources are not configured" }

          $app = Get-Content "project/apps/desktop/src/App.tsx" -Raw
          if ($app -match 'src="/echoverse-wordmark.png"') { throw "Absolute wordmark URL would break under file:// packaging" }
          if ($app -match '"/sounds/') { throw "Absolute sound URL would break under file:// packaging" }

          $main = Get-Content "project/apps/desktop/electron/main.cjs" -Raw
          if ($main -notmatch 'process\.resourcesPath') { throw "Packaged Electron branding path missing" }

      - name: Verify v1.7.4 voice assets
        shell: pwsh
        run: |
          $files = @(
            "project/apps/desktop/public/sounds/outgoing-call.wav",
            "project/apps/desktop/public/sounds/call-connected.wav",
            "project/apps/desktop/public/sounds/call-ended.wav",
            "project/apps/desktop/public/sounds/deafen-toggle.wav",
            "project/apps/desktop/public/sounds/screen-share-toggle.wav",
            "project/apps/desktop/public/sounds/mention.wav"
          )
          foreach ($f in $files) {
            if (!(Test-Path $f)) { throw "Missing v1.7.4 sound asset: $f" }
          }

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "tmp/release/desktop/EchoVerse-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = "tmp/release/desktop/latest.yml"

          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          if (!(Test-Path $blockmap)) { throw "Blockmap missing: $blockmap" }
          if (!(Test-Path $latest)) { throw "latest.yml missing" }

          $content = Get-Content $latest -Raw
          Write-Host $content

          $escaped = [regex]::Escape($version)
          if ($content -notmatch "version:\s*$escaped") { throw "Version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-$escaped\.exe") { throw "Installer filename mismatch" }

      - name: Verify artifact checksums and blockmap
        working-directory: project/apps/desktop
        run: npm run verify:artifacts -- --target win --arch x64

      - name: Launch packaged smoke test
        shell: pwsh
        run: |
          $installer = "tmp/release/desktop/EchoVerse-Setup-${{ steps.version.outputs.version }}.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "EchoVerseSmoke"
          Start-Process $installer -ArgumentList "/S", "/D=$installRoot" -Wait
          $executables = @(Get-ChildItem -Path $installRoot -Filter "EchoVerse.exe" -Recurse -File -ErrorAction SilentlyContinue)
          if ($executables.Count -ne 1) { throw "Expected exactly one installed executable under $installRoot, found $($executables.Count)" }
          $executable = $executables[0].FullName
          $env:ECHO_VERSE_SMOKE_TEST = "1"
          $process = Start-Process $executable -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: EchoVerse-Windows-Test
          path: |
            tmp/release/desktop/EchoVerse-Setup-*.exe
            tmp/release/desktop/EchoVerse-Setup-*.exe.blockmap
            tmp/release/desktop/latest.yml
          if-no-files-found: error
