name: Release EchoVerse

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:win
      - name: Verify Windows updater files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/release" -Filter "EchoVerse-Setup-1.6.6.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem "desktop/release" -Filter "EchoVerse-Setup-1.6.6.exe.blockmap" | Select-Object -First 1
          $latest = Get-ChildItem "desktop/release" -Filter "latest.yml" | Select-Object -First 1

          if (!$installer) { throw "Windows installer missing" }
          if (!$blockmap) { throw "Windows blockmap missing" }
          if (!$latest) { throw "latest.yml missing" }

          $content = Get-Content $latest.FullName -Raw
          Write-Host $content

          if ($content -notmatch "version:\s*1\.6\.5") { throw "latest.yml version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-1\.6\.5\.exe") { throw "latest.yml installer mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:intel
      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel-release
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-release
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, mac-intel, mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: mac-intel-release
          path: release/mac-intel
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64-release
          path: release/mac-arm64
      - name: Verify release payload
        run: |
          find release -maxdepth 3 -type f -print
          test -f "release/windows/EchoVerse-Setup-1.6.6.exe"
          test -f "release/windows/EchoVerse-Setup-1.6.6.exe.blockmap"
          test -f release/windows/latest.yml
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EchoVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/windows/*
            release/mac-intel/*
            release/mac-arm64/*
