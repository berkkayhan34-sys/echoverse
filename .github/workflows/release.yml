name: Release EchoVerse

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:win

      - name: Verify Windows updater metadata
        shell: powershell
        run: |
          if (!(Test-Path "desktop/release/latest.yml")) {
            Write-Error "latest.yml was not generated. Windows auto-update cannot work."
            exit 1
          }
          Get-Content "desktop/release/latest.yml"
          Get-ChildItem "desktop/release" -File | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Intel
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:intel

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-release
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Apple Silicon
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:arm64

      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-release
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - mac-intel
      - mac-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: mac-intel-release
          path: release/mac-intel

      - name: Download macOS Apple Silicon
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64-release
          path: release/mac-arm64

      - name: Show release files
        run: find release -maxdepth 3 -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EchoVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/windows/*
            release/mac-intel/*
            release/mac-arm64/*
