name: Release EchoVerse

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:win

      - name: Verify Windows updater files
        shell: pwsh
        run: |
          $installer = "desktop/release/EchoVerse-Setup-1.6.6.exe"
          $blockmap = "desktop/release/EchoVerse-Setup-1.6.6.exe.blockmap"
          $latest = "desktop/release/latest.yml"

          if (!(Test-Path $installer)) {
            throw "Windows installer missing"
          }

          if (!(Test-Path $blockmap)) {
            throw "Windows blockmap missing"
          }

          if (!(Test-Path $latest)) {
            throw "latest.yml missing"
          }

          $content = Get-Content $latest -Raw
          Write-Host $content

          if ($content -notmatch "version:\s*1\.6\.6") {
            throw "Windows metadata version mismatch"
          }

          if ($content -notmatch "EchoVerse-Setup-1\.6\.6\.exe") {
            throw "Windows metadata filename mismatch"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/EchoVerse-Setup-1.6.6.exe
            desktop/release/EchoVerse-Setup-1.6.6.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error


  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Intel
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:intel

      - name: Show Intel release files
        shell: bash
        run: |
          echo "=== Intel release files ==="
          find desktop/release -maxdepth 2 -type f -print

      - name: Verify Intel artifacts
        shell: bash
        run: |
          set -e

          test -f "desktop/release/EchoVerse-1.6.6-x64.dmg"
          test -f "desktop/release/EchoVerse-1.6.6-x64.dmg.blockmap"
          test -f "desktop/release/EchoVerse-1.6.6-x64.zip"
          test -f "desktop/release/EchoVerse-1.6.6-x64.zip.blockmap"

          echo "Intel artifacts OK"

      - name: Upload Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-release
          path: |
            desktop/release/EchoVerse-1.6.6-x64.dmg
            desktop/release/EchoVerse-1.6.6-x64.dmg.blockmap
            desktop/release/EchoVerse-1.6.6-x64.zip
            desktop/release/EchoVerse-1.6.6-x64.zip.blockmap
          if-no-files-found: error


  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Apple Silicon
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:arm64

      - name: Show ARM64 release files
        shell: bash
        run: |
          echo "=== ARM64 release files ==="
          find desktop/release -maxdepth 2 -type f -print

      - name: Verify ARM64 artifacts
        shell: bash
        run: |
          set -e

          test -f "desktop/release/EchoVerse-1.6.6-arm64.dmg"
          test -f "desktop/release/EchoVerse-1.6.6-arm64.dmg.blockmap"
          test -f "desktop/release/EchoVerse-1.6.6-arm64.zip"
          test -f "desktop/release/EchoVerse-1.6.6-arm64.zip.blockmap"

          echo "ARM64 artifacts OK"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-release
          path: |
            desktop/release/EchoVerse-1.6.6-arm64.dmg
            desktop/release/EchoVerse-1.6.6-arm64.dmg.blockmap
            desktop/release/EchoVerse-1.6.6-arm64.zip
            desktop/release/EchoVerse-1.6.6-arm64.zip.blockmap
          if-no-files-found: error


  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - mac-intel
      - mac-arm64

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-intel-release
          path: release/mac-intel

      - name: Download ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64-release
          path: release/mac-arm64

      - name: Show all release files
        shell: bash
        run: |
          echo "=== RELEASE FILES ==="
          find release -type f -print

      - name: Install YAML helper
        run: npm install yaml@2

      - name: Generate combined latest-mac.yml
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const YAML = require("yaml");

          const version = "1.6.6";

          const intel =
            "release/mac-intel/EchoVerse-1.6.6-x64.zip";

          const arm =
            "release/mac-arm64/EchoVerse-1.6.6-arm64.zip";

          for (const file of [intel, arm]) {
            if (!fs.existsSync(file)) {
              throw new Error(`Missing ${file}`);
            }

            if (!fs.existsSync(file + ".blockmap")) {
              throw new Error(`Missing ${file}.blockmap`);
            }
          }

          function sha512(file) {
            return crypto
              .createHash("sha512")
              .update(fs.readFileSync(file))
              .digest("base64");
          }

          function size(file) {
            return fs.statSync(file).size;
          }

          const intelSha = sha512(intel);
          const armSha = sha512(arm);

          const metadata = {
            version: version,

            files: [
              {
                url: path.basename(intel),
                sha512: intelSha,
                size: size(intel)
              },
              {
                url: path.basename(arm),
                sha512: armSha,
                size: size(arm)
              }
            ],

            path: path.basename(intel),
            sha512: intelSha,
            releaseDate: new Date().toISOString()
          };

          const output = YAML.stringify(metadata);

          fs.writeFileSync(
            "release/latest-mac.yml",
            output,
            "utf8"
          );

          console.log("=== latest-mac.yml ===");
          console.log(output);
          NODE

      - name: Verify complete updater payload
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Windows..."

          test -f "release/windows/EchoVerse-Setup-1.6.6.exe"
          test -f "release/windows/EchoVerse-Setup-1.6.6.exe.blockmap"
          test -f "release/windows/latest.yml"

          echo "Checking Intel..."

          test -f "release/mac-intel/EchoVerse-1.6.6-x64.dmg"
          test -f "release/mac-intel/EchoVerse-1.6.6-x64.dmg.blockmap"
          test -f "release/mac-intel/EchoVerse-1.6.6-x64.zip"
          test -f "release/mac-intel/EchoVerse-1.6.6-x64.zip.blockmap"

          echo "Checking Apple Silicon..."

          test -f "release/mac-arm64/EchoVerse-1.6.6-arm64.dmg"
          test -f "release/mac-arm64/EchoVerse-1.6.6-arm64.dmg.blockmap"
          test -f "release/mac-arm64/EchoVerse-1.6.6-arm64.zip"
          test -f "release/mac-arm64/EchoVerse-1.6.6-arm64.zip.blockmap"

          echo "Checking macOS updater metadata..."

          test -f "release/latest-mac.yml"

          grep -q "version: 1.6.6" release/latest-mac.yml
          grep -q "EchoVerse-1.6.6-x64.zip" release/latest-mac.yml
          grep -q "EchoVerse-1.6.6-arm64.zip" release/latest-mac.yml

          echo "All updater payload checks passed."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EchoVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/windows/*
            release/mac-intel/*
            release/mac-arm64/*
            release/latest-mac.yml