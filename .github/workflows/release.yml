name: Release EchoVerse

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:win

      - name: Verify Windows updater files
        shell: pwsh
        run: |
          $installer = "desktop/release/EchoVerse-Setup-1.6.6.exe"
          $blockmap = "desktop/release/EchoVerse-Setup-1.6.6.exe.blockmap"
          $latest = "desktop/release/latest.yml"

          if (!(Test-Path $installer)) { throw "Windows installer missing" }
          if (!(Test-Path $blockmap)) { throw "Windows blockmap missing" }
          if (!(Test-Path $latest)) { throw "latest.yml missing" }

          $content = Get-Content $latest -Raw
          Write-Host $content

          if ($content -notmatch "version:\s*1\.6\.6") { throw "Windows metadata version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-1\.6\.6\.exe") { throw "Windows metadata filename mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/EchoVerse-Setup-1.6.6.exe
            desktop/release/EchoVerse-Setup-1.6.6.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Intel
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:intel

      - name: Verify Intel artifacts
        shell: bash
        run: |
          set -e
          test -f desktop/release/EchoVerse-1.6.6-x64.dmg
          test -f desktop/release/EchoVerse-1.6.6-x64-mac.zip
          test -f desktop/release/EchoVerse-1.6.6-x64-mac.zip.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel-release
          path: |
            desktop/release/EchoVerse-1.6.6-x64.dmg
            desktop/release/EchoVerse-1.6.6-x64.dmg.blockmap
            desktop/release/EchoVerse-1.6.6-x64-mac.zip
            desktop/release/EchoVerse-1.6.6-x64-mac.zip.blockmap
          if-no-files-found: error

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Apple Silicon
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:arm64

      - name: Verify ARM64 artifacts
        shell: bash
        run: |
          set -e
          test -f desktop/release/EchoVerse-1.6.6-arm64.dmg
          test -f desktop/release/EchoVerse-1.6.6-arm64-mac.zip
          test -f desktop/release/EchoVerse-1.6.6-arm64-mac.zip.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-release
          path: |
            desktop/release/EchoVerse-1.6.6-arm64.dmg
            desktop/release/EchoVerse-1.6.6-arm64.dmg.blockmap
            desktop/release/EchoVerse-1.6.6-arm64-mac.zip
            desktop/release/EchoVerse-1.6.6-arm64-mac.zip.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, mac-intel, mac-arm64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - uses: actions/download-artifact@v4
        with:
          name: mac-intel-release
          path: release/mac-intel

      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64-release
          path: release/mac-arm64

      - name: Install YAML helper
        run: npm install yaml@2

      - name: Build combined latest-mac.yml
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const YAML = require("yaml");

          const version = "1.6.6";
          const intel = "release/mac-intel/EchoVerse-1.6.6-x64-mac.zip";
          const arm = "release/mac-arm64/EchoVerse-1.6.6-arm64-mac.zip";

          for (const file of [intel, arm]) {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            if (!fs.existsSync(file + ".blockmap")) throw new Error(`Missing ${file}.blockmap`);
          }

          const sha512 = file =>
            crypto.createHash("sha512").update(fs.readFileSync(file)).digest("base64");

          const size = file => fs.statSync(file).size;

          const doc = {
            version,
            files: [
              {
                url: path.basename(intel),
                sha512: sha512(intel),
                size: size(intel)
              },
              {
                url: path.basename(arm),
                sha512: sha512(arm),
                size: size(arm)
              }
            ],
            path: path.basename(intel),
            sha512: sha512(intel),
            releaseDate: new Date().toISOString()
          };

          fs.writeFileSync(
            "release/latest-mac.yml",
            YAML.stringify(doc),
            "utf8"
          );
          console.log(fs.readFileSync("release/latest-mac.yml", "utf8"));
          NODE

      - name: Verify complete updater payload
        shell: bash
        run: |
          set -euo pipefail

          test -f release/windows/EchoVerse-Setup-1.6.6.exe
          test -f release/windows/EchoVerse-Setup-1.6.6.exe.blockmap
          test -f release/windows/latest.yml

          test -f release/mac-intel/EchoVerse-1.6.6-x64-mac.zip
          test -f release/mac-intel/EchoVerse-1.6.6-x64-mac.zip.blockmap
          test -f release/mac-arm64/EchoVerse-1.6.6-arm64-mac.zip
          test -f release/mac-arm64/EchoVerse-1.6.6-arm64-mac.zip.blockmap
          test -f release/latest-mac.yml

          grep -q 'version: 1.6.6' release/latest-mac.yml
          grep -q 'EchoVerse-1.6.6-x64-mac.zip' release/latest-mac.yml
          grep -q 'EchoVerse-1.6.6-arm64-mac.zip' release/latest-mac.yml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EchoVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/windows/*
            release/mac-intel/*
            release/mac-arm64/*
            release/latest-mac.yml
