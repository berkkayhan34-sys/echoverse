name: Release EchoVerse

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $desktopVersion = (Get-Content "project/apps/desktop/package.json" -Raw | ConvertFrom-Json).version
          if ($desktopVersion -ne $version) { throw "project/apps/desktop/package.json version mismatch: canonical=$version package=$desktopVersion" }
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag/package mismatch: tag=${{ github.ref_name }} package=$version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build Windows
        working-directory: project/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:win
      - name: Verify Windows updater files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "tmp/release/desktop/EchoVerse-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $latest = "tmp/release/desktop/latest.yml"
          if (!(Test-Path $installer)) { throw "Windows installer missing" }
          if (!(Test-Path $blockmap)) { throw "Windows blockmap missing" }
          if (!(Test-Path $latest)) { throw "latest.yml missing" }
          $content = Get-Content $latest -Raw
          $escaped = [regex]::Escape($version)
          if ($content -notmatch "version:\s*$escaped") { throw "Windows metadata version mismatch" }
          if ($content -notmatch "EchoVerse-Setup-$escaped\.exe") { throw "Windows metadata filename mismatch" }
      - name: Verify Windows artifact checksums and blockmap
        working-directory: project/apps/desktop
        run: npm run verify:artifacts -- --target win --arch x64
      - name: Launch packaged Windows smoke test
        shell: pwsh
        run: |
          $installer = "tmp/release/desktop/EchoVerse-Setup-${{ steps.version.outputs.version }}.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "EchoVerseSmoke"
          Start-Process $installer -ArgumentList "/S", "/D=$installRoot" -Wait
          $executables = @(Get-ChildItem -Path $installRoot -Filter "EchoVerse.exe" -Recurse -File -ErrorAction SilentlyContinue)
          if ($executables.Count -ne 1) { throw "Expected exactly one installed executable under $installRoot, found $($executables.Count)" }
          $executable = $executables[0].FullName
          $env:ECHO_VERSE_SMOKE_TEST = "1"
          $process = Start-Process $executable -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            tmp/release/desktop/EchoVerse-Setup-*.exe
            tmp/release/desktop/EchoVerse-Setup-*.exe.blockmap
            tmp/release/desktop/latest.yml
          if-no-files-found: error

  mac-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DESKTOP_VERSION=$(node -p "require('./project/apps/desktop/package.json').version")
          test "$DESKTOP_VERSION" = "$VERSION"
          test "v$VERSION" = "${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build macOS Intel
        working-directory: project/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:intel
      - name: Verify Intel artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          test -f "tmp/release/desktop/EchoVerse-$V-x64.dmg"
          test -f "tmp/release/desktop/EchoVerse-$V-x64.dmg.blockmap"
          test -f "tmp/release/desktop/EchoVerse-$V-x64.zip"
          test -f "tmp/release/desktop/EchoVerse-$V-x64.zip.blockmap"
      - name: Verify Intel artifact checksums and blockmap
        working-directory: project/apps/desktop
        run: npm run verify:artifacts -- --target mac --arch x64
      - name: Launch packaged Intel smoke test
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/echoverse-intel-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "tmp/release/desktop/EchoVerse-${{ steps.version.outputs.version }}-x64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          ECHO_VERSE_SMOKE_TEST=1 "$mount_point/EchoVerse.app/Contents/MacOS/EchoVerse"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-intel-release
          path: |
            tmp/release/desktop/EchoVerse-*-x64.dmg
            tmp/release/desktop/EchoVerse-*-x64.dmg.blockmap
            tmp/release/desktop/EchoVerse-*-x64.zip
            tmp/release/desktop/EchoVerse-*-x64.zip.blockmap
          if-no-files-found: error

  mac-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DESKTOP_VERSION=$(node -p "require('./project/apps/desktop/package.json').version")
          test "$DESKTOP_VERSION" = "$VERSION"
          test "v$VERSION" = "${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Build macOS Apple Silicon
        working-directory: project/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:mac:arm64
      - name: Verify ARM64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          test -f "tmp/release/desktop/EchoVerse-$V-arm64.dmg"
          test -f "tmp/release/desktop/EchoVerse-$V-arm64.dmg.blockmap"
          test -f "tmp/release/desktop/EchoVerse-$V-arm64.zip"
          test -f "tmp/release/desktop/EchoVerse-$V-arm64.zip.blockmap"
      - name: Verify ARM64 artifact checksums and blockmap
        working-directory: project/apps/desktop
        run: npm run verify:artifacts -- --target mac --arch arm64
      - name: Launch packaged Apple Silicon smoke test
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/echoverse-arm64-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "tmp/release/desktop/EchoVerse-${{ steps.version.outputs.version }}-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          ECHO_VERSE_SMOKE_TEST=1 "$mount_point/EchoVerse.app/Contents/MacOS/EchoVerse"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-release
          path: |
            tmp/release/desktop/EchoVerse-*-arm64.dmg
            tmp/release/desktop/EchoVerse-*-arm64.dmg.blockmap
            tmp/release/desktop/EchoVerse-*-arm64.zip
            tmp/release/desktop/EchoVerse-*-arm64.zip.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, mac-intel, mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release/windows
      - uses: actions/download-artifact@v8
        with:
          name: mac-intel-release
          path: release/mac-intel
      - uses: actions/download-artifact@v8
        with:
          name: mac-arm64-release
          path: release/mac-arm64
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < "source/VERSION")
          DESKTOP_VERSION=$(node -p "require('./source/project/apps/desktop/package.json').version")
          test "$DESKTOP_VERSION" = "$VERSION"
          test "v$VERSION" = "${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install YAML helper
        run: npm install yaml@2
      - name: Build combined latest-mac.yml
        shell: bash
        run: |
          set -euo pipefail
          export EV_VERSION="${{ steps.version.outputs.version }}"
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const YAML = require("yaml");
          const version = process.env.EV_VERSION;
          const intel = `release/mac-intel/EchoVerse-${version}-x64.zip`;
          const arm = `release/mac-arm64/EchoVerse-${version}-arm64.zip`;
          for (const file of [intel, arm]) {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            if (!fs.existsSync(file + ".blockmap")) throw new Error(`Missing ${file}.blockmap`);
          }
          const sha512 = file => crypto.createHash("sha512").update(fs.readFileSync(file)).digest("base64");
          const size = file => fs.statSync(file).size;
          const doc = {
            version,
            files: [
              { url: path.basename(intel), sha512: sha512(intel), size: size(intel) },
              { url: path.basename(arm), sha512: sha512(arm), size: size(arm) }
            ],
            path: path.basename(intel),
            sha512: sha512(intel),
            releaseDate: new Date().toISOString()
          };
          fs.writeFileSync("release/latest-mac.yml", YAML.stringify(doc), "utf8");
          console.log(fs.readFileSync("release/latest-mac.yml", "utf8"));
          NODE
      - name: Verify complete updater payload
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          test -f "release/windows/EchoVerse-Setup-$V.exe"
          test -f "release/windows/EchoVerse-Setup-$V.exe.blockmap"
          test -f release/windows/latest.yml
          test -f "release/mac-intel/EchoVerse-$V-x64.zip"
          test -f "release/mac-intel/EchoVerse-$V-x64.zip.blockmap"
          test -f "release/mac-arm64/EchoVerse-$V-arm64.zip"
          test -f "release/mac-arm64/EchoVerse-$V-arm64.zip.blockmap"
          test -f release/latest-mac.yml
          grep -q "version: $V" release/latest-mac.yml
          grep -q "EchoVerse-$V-x64.zip" release/latest-mac.yml
          grep -q "EchoVerse-$V-arm64.zip" release/latest-mac.yml
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EchoVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/windows/*
            release/mac-intel/*
            release/mac-arm64/*
            release/latest-mac.yml
