services:
  - type: web
    name: echoverse-server
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: npm --workspace=@echoverse/server start
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
